<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dropshot is a macOS menu-bar utility that turns a dragged HEIC image into clipboard-ready image content.">
    <title>Dropshot</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.6;
      }
      body {
        margin: 0;
        padding: 4rem 1.5rem;
      }
      main {
        max-width: 38rem;
        margin-inline: auto;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2.5rem;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }
      p { margin: 0 0 1.25rem; }
      .status {
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid GrayText;
        font-size: 0.9375rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dropshot</h1>
      <p>A macOS menu-bar utility that turns a dragged HEIC image into clipboard-ready image content.</p>
      <p class="status">This is the initial Dropshot website. Downloads are coming later.</p>
    </main>
  </body>
</html>
